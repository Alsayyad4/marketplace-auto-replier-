<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SubSell Auto-Reply</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; width: 460px; margin: 0; padding: 10px 12px 14px; font-size: 12px; line-height: 1.4; }
      h1 { font-size: 14px; margin: 0 0 6px; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
      .spacer { flex: 1; }
      button { font-size: 12px; padding: 6px 10px; border-radius: 6px; border: 1px solid #888; background: #f4f4f4; cursor: pointer; }
      button.primary { background: #1877f2; color: #fff; border-color: #1877f2; }
      .panel { border: 1px solid #ccc; border-radius: 6px; padding: 8px; margin-bottom: 10px; background: rgba(127,127,127,.06); }
      .panel h2 { font-size: 12px; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .04em; color: #555; }
      .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; }
      .kv div:nth-child(odd) { color: #777; }
      table { border-collapse: collapse; width: 100%; font-size: 11px; }
      th, td { border: 1px solid #ddd; padding: 3px 5px; text-align: left; vertical-align: top; }
      th { background: rgba(127,127,127,.12); }
      .scrollx { overflow: auto; max-height: 200px; }
      .name { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      textarea { width: 100%; height: 110px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10px; box-sizing: border-box; }
      .muted { color: #999; }
      .ok { color: #1a8f3c; } .warn { color: #c47f00; } .bad { color: #c0392b; }
      .switch { font-weight: 600; }
      .pill { padding: 2px 8px; border-radius: 999px; font-size: 11px; }
      .pill.on { background: #1a8f3c; color: #fff; } .pill.off { background: #999; color: #fff; }
      input[type="range"] { width: 160px; vertical-align: middle; }
      a { color: #1877f2; }
    </style>
  </head>
  <body>
    <h1>SubSell Auto-Reply</h1>

    <div class="row">
      <button id="toggle" class="primary">Turn ON</button>
      <span id="statePill" class="pill off">OFF</span>
      <span class="spacer"></span>
      <a href="#" id="openOptions">Settings ▸</a>
    </div>

    <div class="row">
      <button id="openMp" class="primary" style="background:#0866ff;border-color:#0866ff;">📨 Open Marketplace</button>
      <span id="openMpStatus" class="muted"></span>
    </div>

    <div class="panel">
      <h2>Status</h2>
      <div class="kv" id="status">
        <div>API key</div><div id="apiKey">—</div>
        <div>This hour</div><div id="hour">—</div>
        <div>Today</div><div id="day">—</div>
        <div>Business hours</div><div id="hours">—</div>
      </div>
    </div>

    <div class="panel">
      <h2>Response delay: <span id="delayVal"></span>s</h2>
      <input type="range" id="delay" min="0" max="180" step="5" />
    </div>

    <div class="panel">
      <h2>Debug (live)</h2>
      <div class="kv" id="tick"><div class="muted">No scan yet.</div></div>
    </div>

    <div class="panel">
      <h2>Unread diagnostic</h2>
      <div class="row">
        <button id="scan" class="primary">Scan now</button>
        <button id="copy">Copy ALL</button>
        <span id="diagStatus" class="muted"></span>
      </div>
      <div class="scrollx">
        <table id="fp">
          <thead><tr><th>#</th><th>name</th><th>unread?</th><th>signal</th><th>maxW</th><th>dotBg</th><th>pseudoBg</th><th>svg#</th><th>aria-label</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <textarea id="dump" readonly placeholder="Run a scan first…"></textarea>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
